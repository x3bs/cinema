<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <style id="cf-noflash">html,body{background:#000!important}</style>
  <meta charset="UTF-8" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1280px; height: 720px; overflow: hidden; background: #000; color: #efefec; font-family: "Segoe UI", Tahoma, Arial, sans-serif; }
    #player { position: absolute; left: 0; top: -110px; width: 1280px; height: 940px; border: 0; pointer-events: none; }
    #player iframe { width: 100%; height: 100%; border: 0; pointer-events: none; }
    #tw { position: absolute; left: 0; top: -60px; width: 1280px; height: 840px; display: none; pointer-events: none; }
    #tw iframe { width: 100%; height: 100%; border: 0; pointer-events: none; }
    #vid { position: absolute; inset: 0; width: 1280px; height: 720px; object-fit: contain; background: #000; display: none; }
    .shield { position: absolute; inset: 0; z-index: 1; }
    .idle { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
      background: radial-gradient(ellipse at 50% 40%, #17171b, #050506 75%); transition: opacity .6s ease; }
    .idle img { width: 210px; opacity: .9; }
    .idle b { font: 700 34px "Segoe UI", Tahoma, Arial, sans-serif; color: #cfcfcb; }
    .idle em { font-style: normal; font-size: 22px; color: #6e6e74; }
    .hide { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="player"></div>
  <div id="tw"></div>
  <video id="vid" playsinline preload="auto"></video>
  <div class="shield"></div>
  <div class="idle" id="idle">
    <img src="logo.svg" alt="" />
    <b>فالكوني سينما</b>
    <em id="idleText">لا يوجد عرض الآن</em>
  </div>
  <script>
    const PAD = 110;
    const idle = document.getElementById("idle"), idleText = document.getElementById("idleText");
    const video = document.getElementById("vid");
    let player = null, ready = false, pending = null, apiLoading = false, altHost = false;
    let last = null, mode = null, hls = null, hlsLoading = false;
    let vol = 0, curVol = 0, reported = "", endedNow = false, lastSeek = 0;
    let tw = null, twLoading = false, twReady = false;
    const RES = new URLSearchParams(location.search).get("res");
    const twBox = document.getElementById("tw");

    // ارسال للعبة او السيرفر
    function send(name, data) {
      if (RES) {
        fetch(`https://${RES}/${name}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) }).catch(() => {});
      } else {
        fetch(`${name === "cin_meta" ? "meta" : "diag"}?${new URLSearchParams(data)}`).catch(() => {});
      }
    }

    // رسالة على الشاشة
    function showIdle(text) { idle.classList.remove("hide"); idleText.textContent = text; }

    // تحميل مكتبة يوتيوب
    function loadApi() {
      if (apiLoading) return;
      apiLoading = true;
      const s = document.createElement("script");
      s.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(s);
    }

    // انشاء مشغل يوتيوب
    function makePlayer() {
      ready = false;
      if (player && player.destroy) { try { player.destroy(); } catch (e) {} }
      document.getElementById("player") || document.body.insertAdjacentHTML("afterbegin", '<div id="player"></div>');
      player = new YT.Player("player", {
        width: 1280, height: 720 + PAD * 2,
        host: altHost ? "https://www.youtube-nocookie.com" : "https://www.youtube.com",
        playerVars: { origin: location.origin, autoplay: 1, controls: 1, disablekb: 1, rel: 0, modestbranding: 1, iv_load_policy: 3, playsinline: 1, fs: 0 },
        events: {
          onReady: () => { ready = true; player.setVolume(0); if (pending) { const p = pending; pending = null; start(p); } },
          onStateChange: (e) => {
            if (mode !== "yt") return;
            if (e.data === YT.PlayerState.PLAYING) { if (!endedNow) idle.classList.add("hide"); report(); }
            if (e.data === YT.PlayerState.ENDED) showEnded();
          },
          onError: (e) => {
            if (!altHost && [2, 5, 100].indexOf(e.data) === -1) { altHost = true; pending = last; makePlayer(); return; }
            showIdle((e.data === 101 || e.data === 150) ? "صاحب الفيديو منع تشغيله خارج يوتيوب" : "ما قدرنا نشغل هذا الفيديو (" + e.data + ")");
          }
        }
      });
    }
    window.onYouTubeIframeAPIReady = makePlayer;

    // تحميل مكتبة البث
    function loadHls(cb) {
      if (window.Hls) return cb();
      if (hlsLoading) return;
      hlsLoading = true;
      const s = document.createElement("script");
      s.src = "hls.js";
      s.onload = () => { hlsLoading = false; cb(); };
      document.head.appendChild(s);
    }

    // تحميل مكتبة تويتش
    function loadTwitch(cb) {
      if (window.Twitch && window.Twitch.Player) return cb();
      if (twLoading) return;
      twLoading = true;
      const s = document.createElement("script");
      s.src = "https://player.twitch.tv/js/embed/v1.js";
      s.onload = () => { twLoading = false; cb(); };
      s.onerror = () => { twLoading = false; showIdle("ما قدرنا نوصل لتويتش"); };
      document.head.appendChild(s);
    }

    // تشغيل تويتش
    function startTwitch(p) {
      if (location.protocol !== "https:") return showIdle("تويتش يحتاج صفحة HTTPS");
      twBox.style.display = "block";
      loadTwitch(() => {
        if (last !== p) return;
        twBox.innerHTML = "";
        twReady = false;
        const opt = { width: 1280, height: 840, parent: [location.hostname], autoplay: true, muted: false, playsinline: true };
        if (p.vid.charAt(0) === "v") { opt.video = p.vid.slice(1); opt.time = Math.max(0, Math.floor(p.t || 0)) + "s"; } else opt.channel = p.vid;
        tw = new Twitch.Player("tw", opt);
        tw.addEventListener(Twitch.Player.READY, () => { twReady = true; tw.setMuted(false); if (p.paused) tw.pause(); });
        tw.addEventListener(Twitch.Player.PLAYING, () => { if (!endedNow) idle.classList.add("hide"); report(); });
        tw.addEventListener(Twitch.Player.ENDED, () => { if (!p.live) showEnded(); });
        tw.addEventListener(Twitch.Player.OFFLINE, () => showIdle("القناة مو مباشرة الحين"));
      });
    }

    // المشغل الحالي
    const A = {
      time: () => mode === "yt" ? (player && player.getCurrentTime ? player.getCurrentTime() : 0) : mode === "twitch" ? (tw ? tw.getCurrentTime() : 0) : video.currentTime || 0,
      dur: () => mode === "yt" ? (player && player.getDuration ? player.getDuration() : 0) : mode === "twitch" ? (tw ? tw.getDuration() : 0) : video.duration,
      playing: () => mode === "yt" ? player.getPlayerState() === YT.PlayerState.PLAYING : mode === "twitch" ? !tw.isPaused() : !video.paused && !video.ended,
      busy: () => mode === "yt" ? [YT.PlayerState.BUFFERING, YT.PlayerState.ENDED].indexOf(player.getPlayerState()) !== -1 : mode === "twitch" ? tw.getEnded() : video.readyState < 3 || video.ended,
      play: () => { if (mode === "yt") player.playVideo(); else if (mode === "twitch") tw.play(); else { const r = video.play(); if (r && r.catch) r.catch(() => {}); } },
      pause: () => { if (mode === "yt") player.pauseVideo(); else if (mode === "twitch") tw.pause(); else video.pause(); },
      seek: (t) => { if (mode === "yt") player.seekTo(t, true); else if (mode === "twitch") tw.seek(t); else video.currentTime = t; },
      ok: () => mode === "yt" ? !!(player && ready && player.getCurrentTime) : mode === "twitch" ? !!(tw && twReady) : !!mode,
    };

    // ابلاغ السيرفر بمدة الفيديو
    function report() {
      const l = last, d = A.dur();
      if (!l || !l.tok || l.dur || l.live || reported === l.tok || !d || !isFinite(d) || d < 1) return;
      reported = l.tok;
      send("cin_meta", { id: l.id, tok: l.tok, dur: Math.floor(d) });
    }

    // انتهى العرض
    function showEnded() { endedNow = true; showIdle("انتهى العرض"); }

    // ايقاف كل شيء
    function clearMedia() {
      if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }
      video.pause(); video.removeAttribute("src"); video.load(); video.style.display = "none";
      if (player && ready && player.stopVideo) player.stopVideo();
      if (tw) { try { tw.pause(); } catch (e) {} tw = null; }
      twBox.innerHTML = ""; twBox.style.display = "none"; twReady = false;
      mode = null;
    }

    video.addEventListener("playing", () => { if (mode !== "yt" && !endedNow) idle.classList.add("hide"); report(); });
    video.addEventListener("loadedmetadata", report);
    video.addEventListener("ended", () => { if (mode !== "yt" && !last.live) showEnded(); });
    video.addEventListener("error", () => { if (mode && mode !== "yt" && !hls && video.getAttribute("src")) showIdle("ما قدرنا نشغل هذا الرابط"); });

    // تشغيل رابط مباشر
    function startVideo(p) {
      video.style.display = "block";
      const path = (p.vid || "").split(/[?#]/)[0].toLowerCase();
      if ((p.kind === "kick" || p.kind === "hls" || /\.(mp4|m4v|mov|m4a)$/.test(path)) && !CAN.h264) return showIdle("متصفح فايف ام ما يدعم ترميز هذا الفيديو (H.264)");
      const isHls = p.kind === "kick" || p.kind === "hls";
      const url = p.kind === "kick" ? p.src : p.vid;
      if (!url) return showIdle("البث غير متاح الآن");
      const go = () => {
        if (p.live) return A.play();
        const t = Math.max(0, p.t || 0);
        if (t > 0) video.currentTime = t;
        if (!p.paused && !p.ended) A.play();
      };
      if (isHls) {
        loadHls(() => {
          if (last !== p) return;
          if (!window.Hls.isSupported()) { video.src = url; video.addEventListener("loadedmetadata", go, { once: true }); return; }
          hls = new window.Hls({ lowLatencyMode: !!p.live, liveSyncDurationCount: 3 });
          hls.on(window.Hls.Events.MANIFEST_PARSED, go);
          hls.on(window.Hls.Events.ERROR, (_, d) => { if (d.fatal || d.details === "manifestIncompatibleCodecsError") showIdle(d.details === "manifestIncompatibleCodecsError" ? "متصفح فايف ام ما يدعم ترميز هذا البث" : (p.live ? "البث متوقف أو انتهى" : "ما قدرنا نشغل هذا الرابط")); });
          hls.loadSource(url);
          hls.attachMedia(video);
        });
      } else {
        video.src = url;
        video.addEventListener("loadedmetadata", go, { once: true });
      }
    }

    // بدء العرض
    function start(p) {
      clearMedia();
      last = p; endedNow = false; reported = "";
      showIdle(p.live ? "جاري الاتصال بالبث" : "جاري التحميل");
      mode = p.kind || "yt";
      if (mode === "yt") {
        if (!player || !ready) { pending = p; mode = null; loadApi(); return; }
        mode = "yt";
        player.loadVideoById({ videoId: p.vid, startSeconds: Math.max(0, p.t || 0) });
        if (p.paused) setTimeout(() => player.pauseVideo(), 600);
        if (p.ended) setTimeout(() => { player.pauseVideo(); showEnded(); }, 700);
      } else if (mode === "twitch") {
        startTwitch(p);
      } else {
        startVideo(p);
      }
    }

    // مزامنة الوقت
    function sync(m) {
      if (!A.ok()) return;
      if (m.ended) { if (A.playing()) A.pause(); showEnded(); return; }
      if (endedNow) { endedNow = false; idle.classList.add("hide"); }
      if (m.paused) {
        if (A.playing()) A.pause();
        if (!last.live && Math.abs(A.time() - m.t) > 1) A.seek(m.t);
        return;
      }
      if (!A.playing()) {
        if (last.live && hls && hls.liveSyncPosition) video.currentTime = hls.liveSyncPosition;
        A.play();
      }
      if (last.live || A.busy()) return;
      const diff = Math.abs(A.time() - m.t), now = Date.now();
      if (m.force ? diff > 1.5 : (diff > 6 && now - lastSeek > 20000)) { lastSeek = now; A.seek(m.t); }
    }

    // الترميزات المدعومة
    const MSE = window.MediaSource && MediaSource.isTypeSupported ? (t) => MediaSource.isTypeSupported(t) : () => false;
    const CAN = {
      h264: !!video.canPlayType('video/mp4; codecs="avc1.42E01E"') || MSE('video/mp4; codecs="avc1.42E01E"'),
      aac: !!video.canPlayType('audio/mp4; codecs="mp4a.40.2"') || MSE('audio/mp4; codecs="mp4a.40.2"'),
      webm: !!video.canPlayType('video/webm; codecs="vp9, opus"'),
      mse: !!window.MediaSource,
    };
    send("cin_diag", Object.assign(Object.fromEntries(Object.keys(CAN).map((k) => [k, CAN[k] ? 1 : 0])), { cv: (navigator.userAgent.match(/Chrome\/(\d+)/) || [0, 0])[1] }));

    // الصوت حسب المسافة
    setInterval(() => {
      curVol += (vol - curVol) * 0.25;
      if (mode === "yt" && player && ready) player.setVolume(Math.round(curVol * 100));
      else if (mode === "twitch") { if (tw && twReady) tw.setVolume(Math.max(0, Math.min(1, curVol))); }
      else if (mode) video.volume = Math.max(0, Math.min(1, curVol));
    }, 50);

    window.addEventListener("message", (ev) => {
      const m = ev.data;
      if (!m || typeof m !== "object") return;
      if (m.type === "load") {
        const k = m.kind || "yt";
        if (k === "yt" && (typeof m.vid !== "string" || !/^[\w-]{11}$/.test(m.vid))) return;
        if (k === "twitch" && !/^(v\d{1,12}|[a-z0-9_]{2,25})$/.test(m.vid || "")) return;
        if (k !== "yt" && k !== "kick" && k !== "twitch" && !/^https?:\/\//.test(m.vid || "")) return;
        if (k === "kick" && !/^https:\/\//.test(m.src || "")) return showIdle("البث غير متاح الآن");
        start(m);
      } else if (m.type === "sync") {
        sync(m);
      } else if (m.type === "stop") {
        pending = null; last = null;
        clearMedia();
        showIdle("لا يوجد عرض الآن");
      } else if (m.type === "audio") {
        vol = Math.max(0, Math.min(1, Number(m.v) || 0));
      }
    });
  </script>
</body>
</html>
